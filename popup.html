<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: system-ui;
      background: #f8f5fc;
      margin: 0;
    }

    h4 {
      margin: 0 0 12px;
      color: #9b7ed8;
      text-align: center;
    }

    .item {
      margin: 8px 0;
    }

    label {
      font-size: 13px;
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #d8c8f0;
      border-radius: 6px;
      margin-top: 4px;
      outline: none;
    }

    input:focus {
      border-color: #b8a2e8;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 14px;
    }

    #startBtn {
      background: #b8a2e8;
      color: #ffffff;
    }

    #stopBtn {
      background: #d1c4e9;
      color: #555;
    }
  </style>
</head>

<body>
  <h4>随机定时刷新</h4>
  <div class="item">
    <label>最小秒数</label>
    <input type="number" id="minTime" value="10" min="1">
  </div>
  <div class="item">
    <label>最大秒数</label>
    <input type="number" id="maxTime" value="30" min="1">
  </div>

  <button id="startBtn">开始随机刷新</button>
  <button id="stopBtn">停止刷新</button>

  <script src="popup.js"></script>
</body>

</html>
